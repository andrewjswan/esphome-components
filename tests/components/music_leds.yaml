# Music LEDs component test configuration
external_components:
  - source:
      type: local
      path: ../../components
    components: [fastled_helper, music_leds]

fastled_helper:
  id: palettes
  palettes: true
  music_leds: true

i2s_audio:
  i2s_lrclk_pin: 15
  i2s_bclk_pin: 14

microphone:
  - platform: i2s_audio
    id: adc_mic
    adc_type: external
    sample_rate: 10240
    bits_per_sample: 16bit
    i2s_din_pin: 32
    channel: right

music_leds:
  id: music_light
  on_sound_loop:
    - logger.log:
        format: "${friendly_name} Sound loop, %f %d %f %d"
        args:
          - volume_smth
          - volume_raw
          - fft_major_peak
          - sample_peak

light:
  - platform: esp32_rmt_led_strip
    pin: GPIO3
    num_leds: 300
    name: "NeoPixel"
    chipset: WS2812
    channel_colors: GRB
    effects:
      - music_leds_effect:
          name: "Pixels with Music"
          mode: PIXELS
