# NerdMiner component test configuration
external_components:
  - source:
      type: local
      path: ../../components
    components: [nerdminer]

http_request:
  useragent: "esphome/${name} (${project_version})"
  verify_ssl: false
  timeout: 10s

nerdminer:
  id: esp_miner
  walletid: "wallet"

binary_sensor:
  - platform: template
    name: "State"
    id: miner_state
    icon: mdi:lan-connect
    lambda: |-
      return id(esp_miner).getMinerState();
    web_server:
      sorting_weight: 1

sensor:
  - platform: template
    name: "Valid Blocks"
    icon: mdi:trophy-award
    lambda: |-
      return id(esp_miner).getValidBlocks();
    accuracy_decimals: 0
    update_interval: 60s
    web_server:
      sorting_weight: 2

  - platform: template
    name: "Block Templates"
    icon: mdi:code-block-brackets
    lambda: |-
      return id(esp_miner).getBlockTemplates();
    accuracy_decimals: 0
    update_interval: 60s
    web_server:
      sorting_weight: 3

  - platform: template
    name: "Best Difficulty"
    icon: mdi:vector-difference
    lambda: |-
      return id(esp_miner).getBestDiff();
    accuracy_decimals: 3
    update_interval: 60s
    web_server:
      sorting_weight: 4

  - platform: template
    name: "32Bit Shares"
    icon: mdi:cpu-32-bit
    lambda: |-
      return id(esp_miner).get32BitShares();
    accuracy_decimals: 0
    update_interval: 60s
    web_server:
      sorting_weight: 5

  - platform: template
    name: "Speed"
    icon: mdi:speedometer
    lambda: |-
      return id(esp_miner).getHashrate();
    accuracy_decimals: 2
    unit_of_measurement: "KH/s"
    update_interval: 60s
    web_server:
      sorting_weight: 6

  - platform: template
    name: "Hashes"
    icon: mdi:pound-box-outline
    lambda: |-
      return id(esp_miner).getTotalHashes();
    accuracy_decimals: 0
    unit_of_measurement: "MH"
    update_interval: 60s
    web_server:
      sorting_weight: 7

  - platform: internal_temperature
    name: "Device Temperature"
    id: device_temperature
    icon: mdi:thermometer
    device_class: temperature
    entity_category: diagnostic
