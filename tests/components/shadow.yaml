# Shadow component test configuration
external_components:
  - source:
      type: local
      path: ../../components
    components: [shadow]

script:
  - id: some_script
    then:
      - logger.log: "${friendly_name} Script Running..."
    mode: queued

shadow:
  - id: esp_shadow
    script_id: some_script
    interval: 60s
    priority: 1

  - id: esp_shadow_next
    script_id: some_script
    interval: 90s
    priority: 3
